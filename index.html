<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>শুভ জন্মদিন শেফা!🩷</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Hind Siliguri', sans-serif;
            overflow-x: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px; /* মোবাইলের জন্য পারফেক্ট সাইজ */
            margin: auto;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem; /* ছোট করা হয়েছে যাতে ভেঙে না যায় */
            margin: 10px 0;
        }

        .sub-title {
            color: #ff4d6d;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .animated-sticker {
            width: 120px; /* মোবাইল ফ্রেন্ডলি সাইজ */
            height: auto;
            margin-bottom: 15px;
        }

        .wish-box {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            font-size: 1rem;
            line-height: 1.5;
            color: #444;
            border: 1px dashed #ff4d6d;
            margin-bottom: 20px;
        }

        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            width: 100%; /* মোবাইলে সহজে ক্লিক করার জন্য */
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
        }

        /* মোবাইল স্ক্রিন খুব ছোট হলে ফন্ট আরও কিছুটা কমবে */
        @media (max-width: 350px) {
            h1 { font-size: 1.5rem; }
            .wish-box { font-size: 0.9rem; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <audio id="bgMusic" loop>

        </audio>
